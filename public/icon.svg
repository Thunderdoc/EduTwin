<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#65a30d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded rectangle background -->
  <rect width="512" height="512" rx="80" ry="80" fill="url(#bgGradient)"/>

  <!-- Letter E -->
  <text x="256" y="280" font-family="Arial, sans-serif" font-size="280" font-weight="bold"
        fill="white" text-anchor="middle" dominant-baseline="middle">E</text>

  <!-- Graduation cap emoji representation -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="80"
        text-anchor="middle">🎓</text>
</svg>
